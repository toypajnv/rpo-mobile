<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="vacancy-release" content="20261030-sibur-fix-v2">
<title>Вход — Мониторинг вакансий</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px system-ui,Arial;background:#f2f6fb;color:#183450;padding:16px;box-sizing:border-box}
.card{width:100%;max-width:390px;background:#fff;padding:32px;border-radius:19px;border:1px solid #e0e8f0;box-shadow:0 15px 50px #102c4313;box-sizing:border-box}
.logo{width:48px;height:48px;display:grid;place-items:center;background:#194c75;border-radius:14px;color:white;font-size:24px;font-weight:800}
h1{font-size:24px;letter-spacing:-.04em;margin:18px 0 8px}p{color:#62798c;line-height:1.5;margin:0 0 25px}
label{display:grid;gap:7px;font-size:13px;font-weight:650;color:#41596e;margin:15px 0}
input{height:44px;border-radius:9px;border:1px solid #cdd9e5;padding:0 13px;font-size:15px;box-sizing:border-box}
button{height:46px;border:0;border-radius:10px;background:#195c91;color:#fff;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:12px}
.error{color:#a51f1f;background:#fff0ee;padding:11px;border-radius:9px;font-size:13px;margin-top:15px}
.bottom{margin-top:25px;font-size:12px;color:#8190a0;text-align:center}
</style></head><body><main class="card">
<div class="logo">Р</div><h1>Мониторинг вакансий</h1>
<p>Производственная безопасность · Тюмень и Нижневартовск.<br>Доступ по логину и паролю.</p>
<form method="post" action="/vacancies/login">
<label>Логин<input name="username" autocomplete="username" required maxlength="80" autofocus></label>
<label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Войти →</button></form>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<div class="bottom">Отдельный доступ · Данные РПО защищены</div>
</main></body></html>
