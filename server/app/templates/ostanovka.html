<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Проверка допуска</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f3f5f4;color:#17211b;display:grid;place-items:center;padding:20px}
    .card{width:min(100%,560px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(28,46,35,.12)}
    .mark{width:52px;height:52px;border-radius:16px;background:#0b6b3a;color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:20px}
    h1{font-size:32px;margin:0 0 8px}
    .subtitle{margin:0 0 8px;color:#66736b}
    .hint{font-size:13px;color:#7a857e;margin:0 0 22px}
    .check-form{display:grid;grid-template-columns:1fr auto;gap:10px}
    input,.check-button{height:54px;border-radius:14px;font-size:17px}
    input{border:1px solid #cbd3ce;padding:0 16px;min-width:0;text-transform:uppercase}
    .check-button{border:0;padding:0 20px;background:#0b6b3a;color:#fff;font-weight:700}
    .result{margin-top:20px;border-radius:18px;padding:20px;display:none}
    .result.allowed{display:block;background:#eaf8ef;border:1px solid #bfe7cd}
    .result.denied{display:block;background:#fff0ef;border:1px solid #f0c8c3}
    .status{font-size:24px;font-weight:800}
    .message{color:#536059;margin-bottom:12px}
    .blocks{display:grid;gap:10px;margin-top:12px}
    .block{background:rgba(255,255,255,.82);border-radius:14px;padding:14px;border:1px solid rgba(0,0,0,.06)}
    .block-title{font-weight:800;margin-bottom:4px}
    .block-message{font-size:14px;color:#59645e}
    .block.video .block-title{color:#8b3a17}
    .block.corporate .block-title{color:#7b2430}
    .spoiler{margin-top:10px;border:0;background:#eef1ef;color:#263b2f;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
    .violation{margin-top:9px;padding:11px 12px;border-radius:10px;background:#f7f8f7;color:#3b4740;white-space:pre-wrap}
    .requirements{display:grid;gap:9px;margin-top:12px}
    .req{background:rgba(255,255,255,.72);border-radius:12px;padding:12px 14px}
    .req-label{font-size:13px;color:#69746e}
    .req-value{font-weight:700}
    .req.required .req-value{color:#9f2d27}
    .error{margin-top:12px;color:#a52f29;min-height:20px}
    @media(max-width:520px){body{padding:12px;align-items:start;padding-top:32px}.card{padding:22px 18px}.check-form{grid-template-columns:1fr}.check-button{width:100%}}
  </style>
</head>
<body>
<main class="card">
  <div class="mark">МНГ</div>
  <h1>Проверка допуска</h1>
  <p class="subtitle">Введите номер пропуска</p>
  <p class="hint">Номер автоматически приводится к формату с буквой «С» в конце.</p>
  <form class="check-form" id="f">
    <input id="p" placeholder="Например 6075052С" maxlength="40" required autocomplete="off" autocapitalize="characters">
    <button class="check-button" id="b">Проверить</button>
  </form>
  <div class="error" id="e"></div>
  <section class="result" id="r">
    <div class="status" id="t"></div>
    <p class="message" id="m"></p>
    <div class="blocks" id="blocks"></div>
    <div class="requirements" id="q"></div>
  </section>
</main>
<script>
const f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),e=document.getElementById('e'),r=document.getElementById('r'),t=document.getElementById('t'),m=document.getElementById('m'),q=document.getElementById('q'),blocks=document.getElementById('blocks');

function normalizeVisiblePass(value){
  let s=(value||'').trim().toUpperCase().replace(/Ё/g,'Е').replace(/С/g,'C');
  s=s.replace(/^ПРОПУСК\s*/,'').replace(/^(?:№|NO\.?|НОМЕР)\s*/,'').replace(/[\s"']/g,'');
  if(/^\d{2,8}(?:-\d{1,8})?$/.test(s))s+='C';
  if(/^\d{2,8}(?:-\d{1,8})?C$/.test(s))return s.slice(0,-1)+'С';
  return s.replace(/C$/,'С');
}

p.addEventListener('blur',()=>{p.value=normalizeVisiblePass(p.value)});

function addBlock(item){
  const card=document.createElement('div');card.className='block '+(item.type||'');
  const title=document.createElement('div');title.className='block-title';title.textContent=item.title||'Ограничение доступа';
  const message=document.createElement('div');message.className='block-message';message.textContent=item.message||'';
  card.append(title,message);
  if(item.description){
    const button=document.createElement('button');button.type='button';button.className='spoiler';button.textContent='Показать описание нарушения';
    const detail=document.createElement('div');detail.className='violation';detail.hidden=true;detail.textContent=item.description;
    button.addEventListener('click',()=>{detail.hidden=!detail.hidden;button.textContent=detail.hidden?'Показать описание нарушения':'Скрыть описание нарушения'});
    card.append(button,detail);
  }
  blocks.appendChild(card);
}

f.addEventListener('submit',async event=>{
  event.preventDefault();
  e.textContent='';r.className='result';q.innerHTML='';blocks.innerHTML='';
  p.value=normalizeVisiblePass(p.value);
  b.disabled=true;b.textContent='Проверяем…';
  try{
    const response=await fetch('/api/ostanovka/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass_number:p.value.trim()})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.detail||'Ошибка проверки');
    r.className='result '+data.status;t.textContent=data.title;m.textContent=data.message;
    (data.blocks||[]).forEach(addBlock);
    (data.requirements||[]).forEach(item=>{
      const card=document.createElement('div');card.className='req '+item.state;
      const label=document.createElement('div');label.className='req-label';label.textContent=item.label;
      const value=document.createElement('div');value.className='req-value';value.textContent=item.value;
      card.append(label,value);q.appendChild(card);
    });
  }catch(err){e.textContent=err.message}
  finally{b.disabled=false;b.textContent='Проверить'}
});
</script>
</body>
</html>
