<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Проверка допуска</title><style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f5f4;color:#17211b;display:grid;place-items:center;padding:20px}.card{width:min(100%,520px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(28,46,35,.12)}.mark{width:52px;height:52px;border-radius:16px;background:#0b6b3a;color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:20px}h1{font-size:32px;margin:0 0 8px}.subtitle{margin:0 0 24px;color:#66736b}.check-form{display:grid;grid-template-columns:1fr auto;gap:10px}input,button{height:54px;border-radius:14px;font-size:17px}input{border:1px solid #cbd3ce;padding:0 16px;min-width:0}button{border:0;padding:0 20px;background:#0b6b3a;color:#fff;font-weight:700}.result{margin-top:20px;border-radius:18px;padding:20px;display:none}.result.allowed{display:block;background:#eaf8ef;border:1px solid #bfe7cd}.result.denied{display:block;background:#fff0ef;border:1px solid #f0c8c3}.status{font-size:24px;font-weight:800}.message{color:#536059}.requirements{display:grid;gap:9px}.req{background:rgba(255,255,255,.72);border-radius:12px;padding:12px 14px}.req-label{font-size:13px;color:#69746e}.req-value{font-weight:700}.req.required .req-value{color:#9f2d27}.error{margin-top:12px;color:#a52f29;min-height:20px}@media(max-width:520px){body{padding:12px;align-items:start;padding-top:32px}.card{padding:22px 18px}.check-form{grid-template-columns:1fr}button{width:100%}}</style></head><body><main class="card"><div class="mark">МНГ</div><h1>Проверка допуска</h1><p class="subtitle">Введите номер пропуска</p><form class="check-form" id="f"><input id="p" placeholder="Номер пропуска" maxlength="40" required><button id="b">Проверить</button></form><div class="error" id="e"></div><section class="result" id="r"><div class="status" id="t"></div><p class="message" id="m"></p><div class="requirements" id="q"></div></section></main><script>const f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),e=document.getElementById('e'),r=document.getElementById('r'),t=document.getElementById('t'),m=document.getElementById('m'),q=document.getElementById('q');f.addEventListener('submit',async x=>{x.preventDefault();e.textContent='';r.className='result';q.innerHTML='';b.disabled=true;b.textContent='Проверяем…';try{const z=await fetch('/api/ostanovka/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass_number:p.value.trim()})}),d=await z.json();if(!z.ok)throw new Error(d.detail||'Ошибка проверки');r.className='result '+d.status;t.textContent=d.title;m.textContent=d.message;(d.requirements||[]).forEach(i=>{const a=document.createElement('div');a.className='req '+i.state;const l=document.createElement('div');l.className='req-label';l.textContent=i.label;const v=document.createElement('div');v.className='req-value';v.textContent=i.value;a.append(l,v);q.appendChild(a)})}catch(err){e.textContent=err.message}finally{b.disabled=false;b.textContent='Проверить'}})</script></body></html>
