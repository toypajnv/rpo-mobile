<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>РПО Сервер — вход</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-body">
<div class="login-shell">
  <section class="brand-panel">
    <div class="brand-mark">🏗️</div><h1>РПО Сервер</h1><p>Контроль передачи этапов работ</p>
    <div class="security-visual"><span>✓</span></div>
  </section>
  <section class="login-card">
    <h2>Вход в систему</h2><p class="muted">Доступ только для операторов</p>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Логин<input name="username" autocomplete="username" placeholder="Введите логин" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" placeholder="Введите пароль" required></label>
      <button class="primary" type="submit">→ Войти</button>
    </form>
    <div class="secure-note">🛡️ <div><b>Защищённый доступ</b><small>Операторская часть требует авторизации</small></div></div>
  </section>
</div></body></html>
