name: Temp patch Android permit entry

on:
  push:
    branches:
      - fix/android-permit-entry-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-permit-entry-20260903
          fetch-depth: 0
      - name: Patch Android permit editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/ru/rpo/mobile/ui/RpoUxApp.kt')
          text = path.read_text(encoding='utf-8')
          old_state = '    var editDetails by remember(s.permitNumber) { mutableStateOf(!permitReady) }\n'
          new_state = '    var editDetails by remember { mutableStateOf(!permitReady) }\n'
          old_effect = '''\n    LaunchedEffect(permitReady) {\n        if (permitReady) editDetails = false\n    }\n'''
          new_effect = '''\n    // Do not collapse the permit details while the worker is typing the permit number.\n    // Previously the form became "ready" after the third symbol and immediately closed,\n    // forcing the worker to tap "Изменить" repeatedly to finish the same number.\n'''
          if old_state not in text:
              raise SystemExit('Expected editDetails state line not found')
          if old_effect not in text:
              raise SystemExit('Expected auto-collapse effect not found')
          text = text.replace(old_state, new_state, 1).replace(old_effect, new_effect, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/ru/rpo/mobile/ui/RpoUxApp.kt
          git commit -m 'Fix Android permit number editor auto-collapse'
          git push origin HEAD:fix/android-permit-entry-20260903
