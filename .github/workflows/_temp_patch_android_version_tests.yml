name: Temp patch Android version tests

on:
  push:
    branches:
      - fix/android-permit-entry-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-permit-entry-20260903
          fetch-depth: 0
      - name: Update regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('server/tests').glob('*.py'):
              text = path.read_text(encoding='utf-8')
              new = text.replace("'2.2.1'", "'2.2.2'").replace('"2.2.1"', '"2.2.2"')
              new = new.replace("'0.7.1'", "'0.7.2'").replace('"0.7.1"', '"0.7.2"')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
      - name: Commit expectations
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/tests
          git commit -m 'Update Android 2.2.2 regression expectations'
          git push origin HEAD:fix/android-permit-entry-20260903
