name: Align dashboard cache regression

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fix-dashboard-cache-test.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Update expected CSS cache version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('server/tests/test_regressions.py')
          text = p.read_text(encoding='utf-8')
          old = 'self.assertIn("app.css?v=20260829-2", template)'
          new = 'self.assertIn("app.css?v=20260829-3", template)'
          if old not in text:
              raise SystemExit('old cache assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python server/tests/test_dashboard_width_fit.py
          git diff --check
      - name: Commit regression alignment
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-dashboard-cache-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update dashboard cache-bust regression expectation'
          git push origin HEAD:develop
