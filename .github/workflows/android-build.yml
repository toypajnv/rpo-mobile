name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/keys/rpo-test.keystore.b64'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/keys/rpo-test.keystore.b64'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-android:
    name: Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

  build-debug-apk:
    name: Build debug APK
    needs: test-android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RPO_SERVER_URL: https://rpo-mng.ru/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare stable test signing key
        shell: bash
        run: |
          base64 --decode .github/keys/rpo-test.keystore.b64 > android/app/rpo-test.keystore
          keytool -list -keystore android/app/rpo-test.keystore -storepass rpo-test-2026 -alias rpo-test >/dev/null

      - name: Build debug APK after tests
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee ../android-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ github.run_number }}
          path: android-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpo-mobile-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
