name: Quality Gate

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: server
      DATABASE_URL: sqlite:////tmp/rpo-quality.db
      SECRET_KEY: quality-gate-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: QualityGate123!
      MAIL_MODE: file
      EXPORT_DIR: /tmp/rpo-quality-exports
      OUTBOX_DIR: /tmp/rpo-quality-outbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements-test.txt

      - name: Validate deployment shell scripts
        run: |
          bash -n ops/autodeploy.sh ops/install-autodeploy.sh ops/configure-stop-mail.sh
          grep -Fx 'ExecStart=/bin/bash /opt/rpo/ops/autodeploy.sh' ops/rpo-autodeploy.service
          if grep -Eq 'chmod[[:space:]].*ops/autodeploy\.sh' ops/install-autodeploy.sh; then
            echo 'Installer must not change the tracked autodeploy.sh mode.' >&2
            exit 1
          fi
          grep -F 'imap.timeweb.ru' ops/configure-stop-mail.sh
          grep -F 'ostanovka@rpo-mng.ru' ops/configure-stop-mail.sh

      - name: Install backend test dependencies
        run: python -m pip install -r server/requirements-test.txt

      - name: Compile backend Python
        run: python -m compileall -q server/app

      - name: Check dashboard and PWA JavaScript syntax
        run: |
          node --check server/app/static/dashboard.js
          node --check server/app/static/dashboard-core.js
          node --check server/app/static/dashboard-ux.js
          node --check server/app/static/dashboard-decisions.js
          node --check server/app/static/dashboard-mobile.js
          node --check server/app/pwa/sync-status.js
          node --check server/app/pwa/deny-lock.js
          node --check server/app/pwa/app.js
          node --check server/app/pwa/ux.js
          node --check server/app/pwa/sw.js

      - name: Run backend regression tests
        run: python -m unittest discover -s server/tests -v

  android-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android unit tests before APK build
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace
