name: PB_MNG Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pb-mng:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: server
      DATABASE_URL: sqlite:////tmp/test_pb_mng.db
      SECRET_KEY: pb-mng-quality-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Test123!
      MAIL_MODE: file
      EXPORT_DIR: /tmp/pb-mng-exports
      OUTBOX_DIR: /tmp/pb-mng-outbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements-test.txt
      - run: python -m pip install -r server/requirements-test.txt
      - name: Compile PB_MNG backend
        run: python -m py_compile server/app/pb_mng_models.py server/app/pb_mng_process.py server/app/stop_registry.py
      - name: Check PB_MNG JavaScript
        run: |
          node --check server/app/pb_mng/app.js
          node --check server/app/pb_mng/sw.js
          node --check server/app/pb_mng/coordinator.js
          python - <<'PY'
          from pathlib import Path
          src = Path('server/app/templates/pb_mng_coordinator.html').read_text(encoding='utf-8')
          assert '/pb-mng/coordinator.js?v=20260930-10' in src
          assert 'Версия координатора 20260930-10' in src
          assert '<script>' not in src
          js = Path('server/app/pb_mng/coordinator.js').read_text(encoding='utf-8')
          assert 'startCoordinator()' in js
          assert 'async function load()' in js
          assert 'loadRegistry()' in js
          assert 'reviewViolationId' in js
          assert 'Реестр остановок' in src
          assert 'Рабочая очередь' in src
          assert 'data-status-card="pending_verification"' in src
          assert 'data-status-card="resolution_revision"' in src
          assert 'data-status-card="ready_for_unblock"' in src
          assert 'data-status-card="awaiting_resumption"' in src
          assert 'data-status-card="closed"' in src
          assert 'applyQueueFilter' in js
          assert 'nextActionHtml' in js
          assert 'peopleAndVehiclesHtml' in js
          assert 'saveCoordinatorNote' in js
          assert 'blocked_vehicle_ids' in js
          assert 'workflow-groups' in src
          assert 'group-blue' in src
          assert 'group-amber' in src
          assert 'group-purple' in src
          assert 'group-green' in src
          assert 'group-red' in src
          mobile = Path('server/app/pb_mng/index.html').read_text(encoding='utf-8')
          assert 'section-context' in mobile
          assert 'section-incident' in mobile
          assert 'section-people' in mobile
          assert 'section-vehicle' in mobile
          assert 'section-evidence' in mobile
          print('External coordinator runtime contract OK')
          PY
      - name: Run PB_MNG workflow test
        run: python -m unittest server.tests.test_pb_mng_workflow -v
