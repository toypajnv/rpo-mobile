name: Apply instruction assistant integration

on:
  push:
    branches: [feature/instruction-assistant-20260906]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[instruction-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/instruction-assistant-20260906
          fetch-depth: 0

      - name: Patch Android, PWA, versions and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  if required:
                      raise SystemExit(f'Marker not found in {path}: {old[:100]!r}')
                  return
              p.write_text(text.replace(old,new),encoding='utf-8')

          replace('android/app/src/main/java/ru/rpo/mobile/ui/RpoUxApp.kt',
                  'private enum class UxTab { WORK, HISTORY, HELP }',
                  'private enum class UxTab { WORK, INSTRUCTION, HISTORY, HELP }')
          replace('android/app/src/main/java/ru/rpo/mobile/ui/RpoUxApp.kt',
                  '''                        NavigationBarItem(\n                            selected = tab == UxTab.HISTORY,''',
                  '''                        NavigationBarItem(\n                            selected = tab == UxTab.INSTRUCTION,\n                            onClick = { tab = UxTab.INSTRUCTION },\n                            icon = { Icon(Icons.Default.CheckCircle, "Инструктаж") },\n                            label = { Text("Инструктаж") },\n                        )\n                        NavigationBarItem(\n                            selected = tab == UxTab.HISTORY,''')
          replace('android/app/src/main/java/ru/rpo/mobile/ui/RpoUxApp.kt',
                  '''                UxTab.WORK -> UxWorkScreen(state, memories, vm, Modifier.padding(padding))\n                UxTab.HISTORY ->''',
                  '''                UxTab.WORK -> UxWorkScreen(state, memories, vm, Modifier.padding(padding))\n                UxTab.INSTRUCTION -> InstructionAssistantScreen(state, Modifier.padding(padding))\n                UxTab.HISTORY ->''')
          replace('android/app/src/main/java/ru/rpo/mobile/ui/RpoUxApp.kt',
                  'UxHelpCard("Версия", "РПО Mobile 2.1 · новый интерфейс. Предыдущий интерфейс и APK 2.0.1 сохранены для быстрого отката.")',
                  'UxHelpCard("Версия", "РПО Mobile 2.3.0 · добавлен помощник при риск-ориентированном инструктаже и мини-база знаний.")')

          replace('android/app/src/main/java/ru/rpo/mobile/ui/InstructionAssistant.kt',
                  '''    var view by remember { mutableStateOf(AssistantView.HOME) }\n    var step by remember { mutableStateOf(1) }\n    var selectedRiskIds by remember { mutableStateOf(setOf<String>()) }\n    var completedAt by remember { mutableStateOf(loadCompletion(LocalContext.current, state.permitNumber)) }''',
                  '''    val context = LocalContext.current\n    var view by remember { mutableStateOf(AssistantView.HOME) }\n    var step by remember { mutableStateOf(1) }\n    var selectedRiskIds by remember { mutableStateOf(setOf<String>()) }\n    var completedAt by remember(state.permitNumber) { mutableStateOf(loadCompletion(context, state.permitNumber)) }''')
          replace('android/app/src/main/java/ru/rpo/mobile/ui/InstructionAssistant.kt',
                  'saveCompletion(LocalContext.current, state.permitNumber, value)',
                  'saveCompletion(context, state.permitNumber, value)')

          replace('android/app/build.gradle.kts','versionCode = 15','versionCode = 16')
          replace('android/app/build.gradle.kts','versionName = "2.2.2"','versionName = "2.3.0"')

          replace('server/app/pwa/index.html',
                  '<link rel="stylesheet" href="/pwa-assets/ux.css?v=20260830-1">',
                  '<link rel="stylesheet" href="/pwa-assets/ux.css?v=20260830-1">\n  <link rel="stylesheet" href="/pwa-assets/instruction-assistant.css?v=20260906-1">')
          replace('server/app/pwa/index.html',
                  '      <section id="tab-history" class="screen" data-screen="history">',
                  '      <section id="tab-instruction" class="screen" data-screen="instruction"><div id="instruction-root"></div></section>\n\n      <section id="tab-history" class="screen" data-screen="history">')
          replace('server/app/pwa/index.html',
                  '      <button type="button" class="nav-item" data-tab="history"><span>◷</span><b>История</b></button>',
                  '      <button type="button" class="nav-item" data-tab="instruction"><span>✓</span><b>Инструктаж</b></button>\n      <button type="button" class="nav-item" data-tab="history"><span>◷</span><b>История</b></button>')
          replace('server/app/pwa/index.html',
                  '  <script src="/pwa-assets/history-status.js?v=20260901-1" defer></script>',
                  '  <script src="/pwa-assets/history-status.js?v=20260901-1" defer></script>\n  <script src="/pwa-assets/instruction-assistant.js?v=20260906-1" defer></script>')
          replace('server/app/pwa/index.html',
                  'PWA 1.2.1 · статусы запрета в истории · единая система с Android РПО 2.2.1.',
                  'PWA 1.3.0 · помощник при инструктаже · единая система с Android РПО 2.3.0.')
          replace('server/app/pwa/app.js',"const PWA_VERSION = '1.2.1';","const PWA_VERSION = '1.3.0';")
          replace('server/app/pwa/sw.js',"const CACHE='rpo-pwa-shell-v1.2.2';","const CACHE='rpo-pwa-shell-v1.3.0';")
          replace('server/app/pwa/sw.js',
                  "'/pwa-assets/history-status.js?v=20260901-1'];",
                  "'/pwa-assets/history-status.js?v=20260901-1','/pwa-assets/instruction-assistant.css?v=20260906-1','/pwa-assets/instruction-assistant.js?v=20260906-1'];")

          replace('server/app/main.py','LATEST_MOBILE_VERSION = "2.2.2"','LATEST_MOBILE_VERSION = "2.3.0"')
          replace('server/app/main.py',
                  'MOBILE_APK_URL = "https://github.com/toypajnv/rpo-mobile/releases/download/v2.2.2-test/rpo-mobile-2.2.2.apk"',
                  'MOBILE_APK_URL = "https://github.com/toypajnv/rpo-mobile/releases/download/v2.3.0-test/rpo-mobile-2.3.0.apk"')
          replace('server/app/main.py','PWA_VERSION = "1.2.2"','PWA_VERSION = "1.3.0"')
          replace('server/app/main.py','_core.app.version = "0.7.4"','_core.app.version = "0.8.0"')

          for p in Path('server/tests').glob('test_*.py'):
              text=p.read_text(encoding='utf-8')
              text=text.replace('2.2.2','2.3.0').replace('1.2.2','1.3.0').replace('0.7.4','0.8.0')
              text=text.replace('versionCode = 15','versionCode = 16')
              text=text.replace('PWA 1.2.1','PWA 1.3.0')
              p.write_text(text,encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android server
          git commit -m "Integrate instruction assistant on Android and iOS [instruction-patched]"
          git push origin HEAD:feature/instruction-assistant-20260906
