name: Apply compact dashboard tables

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-dashboard-fit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply width-fit styles and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path('server/app/static/app.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Dashboard desktop width fit v2.0.1 */'
          lines = [
              '',
              marker,
              '@media (min-width:1000px){',
              '  #tab-transmissions .panel,#tab-works .panel{padding:14px}',
              '  #tab-transmissions .table-wrap,#tab-works .table-wrap{overflow-x:hidden}',
              '  #tab-transmissions table,#tab-works table{width:100%;table-layout:fixed;white-space:normal;font-size:11px}',
              '  #tab-transmissions th,#tab-transmissions td,#tab-works th,#tab-works td{padding:8px 5px;line-height:1.2;vertical-align:top;overflow-wrap:anywhere;word-break:normal}',
              '  #tab-transmissions th,#tab-works th{font-size:10px}',
              '  #tab-transmissions .wrap-cell,#tab-works .works-stage-cell{min-width:0}',
              '  #tab-transmissions .unit-pill,#tab-works .unit-pill{white-space:normal;padding:3px 6px;font-size:10px}',
              '  #tab-transmissions .badge,#tab-works .badge,#tab-works .work-state{white-space:normal;line-height:1.15;text-align:center;justify-content:center;padding:5px 6px}',
              '  #tab-transmissions .approve-button{white-space:normal;padding:6px 7px;font-size:10px}',
              '  #tab-works .progress{width:100%;max-width:86px}',
              '  #tab-works .stage-details summary{padding:7px 8px;gap:5px;align-items:flex-start}',
              '  #tab-works .stage-details summary small{font-size:9px}',
              '  #tab-works .stage-detail-line{grid-template-columns:1fr;gap:4px;padding:6px 0}',
              '  #tab-works .stage-detail-line em{grid-column:1}',
              '  #tab-transmissions th:nth-child(1),#tab-transmissions td:nth-child(1){width:8%}',
              '  #tab-transmissions th:nth-child(2),#tab-transmissions td:nth-child(2){width:8%}',
              '  #tab-transmissions th:nth-child(3),#tab-transmissions td:nth-child(3){width:11%}',
              '  #tab-transmissions th:nth-child(4),#tab-transmissions td:nth-child(4){width:8%}',
              '  #tab-transmissions th:nth-child(5),#tab-transmissions td:nth-child(5){width:15%}',
              '  #tab-transmissions th:nth-child(6),#tab-transmissions td:nth-child(6){width:16%}',
              '  #tab-transmissions th:nth-child(7),#tab-transmissions td:nth-child(7){width:13%}',
              '  #tab-transmissions th:nth-child(8),#tab-transmissions td:nth-child(8){width:11%}',
              '  #tab-transmissions th:nth-child(9),#tab-transmissions td:nth-child(9){width:10%}',
              '  #tab-works th:nth-child(1),#tab-works td:nth-child(1){width:8%}',
              '  #tab-works th:nth-child(2),#tab-works td:nth-child(2){width:8%}',
              '  #tab-works th:nth-child(3),#tab-works td:nth-child(3){width:8%}',
              '  #tab-works th:nth-child(4),#tab-works td:nth-child(4){width:10%}',
              '  #tab-works th:nth-child(5),#tab-works td:nth-child(5){width:10%}',
              '  #tab-works th:nth-child(6),#tab-works td:nth-child(6){width:11%}',
              '  #tab-works th:nth-child(7),#tab-works td:nth-child(7){width:9%}',
              '  #tab-works th:nth-child(8),#tab-works td:nth-child(8){width:20%}',
              '  #tab-works th:nth-child(9),#tab-works td:nth-child(9){width:8%}',
              '  #tab-works th:nth-child(10),#tab-works td:nth-child(10){width:8%}',
              '}',
              '@media (max-width:1700px) and (min-width:1000px){.main{padding-left:22px;padding-right:22px}}',
          ]
          if marker not in css:
              css_path.write_text(css.rstrip() + '\n'.join(lines) + '\n', encoding='utf-8')

          template_path = Path('server/app/templates/dashboard.html')
          template = template_path.read_text(encoding='utf-8')
          template = template.replace('/static/app.css?v=20260829-2', '/static/app.css?v=20260829-3')
          template_path.write_text(template, encoding='utf-8')

          test_path = Path('server/tests/test_dashboard_width_fit.py')
          test_lines = [
              'from pathlib import Path',
              'import unittest',
              '',
              '',
              'class DashboardWidthFitTests(unittest.TestCase):',
              '    def test_operational_tables_fit_desktop_width(self) -> None:',
              '        server_dir = Path(__file__).resolve().parents[1]',
              '        css = (server_dir / "app/static/app.css").read_text(encoding="utf-8")',
              '        html = (server_dir / "app/templates/dashboard.html").read_text(encoding="utf-8")',
              '',
              '        self.assertIn("Dashboard desktop width fit v2.0.1", css)',
              '        self.assertIn("#tab-transmissions .table-wrap,#tab-works .table-wrap{overflow-x:hidden}", css)',
              '        self.assertIn("table-layout:fixed", css)',
              '        self.assertIn("#tab-works .stage-detail-line{grid-template-columns:1fr", css)',
              '        self.assertIn("/static/app.css?v=20260829-3", html)',
              '',
              '',
              'if __name__ == "__main__":',
              '    unittest.main()',
              '',
          ]
          test_path.write_text('\n'.join(test_lines), encoding='utf-8')
          PY

          python server/tests/test_dashboard_width_fit.py
          git diff --check

      - name: Commit compact table layout
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-dashboard-fit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fit transmissions and works tables to desktop width'
          git push origin HEAD:develop
