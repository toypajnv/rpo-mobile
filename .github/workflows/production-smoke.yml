name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Production health, UX, PWA and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for VPS autodeploy and PWA server-confirmation hotfix
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            health="$(curl -fsS --max-time 8 https://rpo-mng.ru/health 2>/dev/null || true)"
            config="$(curl -fsS --max-time 8 'https://rpo-mng.ru/api/mobile/config?app_version=2.0.1' 2>/dev/null || true)"
            pwa="$(curl -fsS --max-time 8 https://rpo-mng.ru/app/ 2>/dev/null || true)"
            dashboard_loader="$(curl -fsS --max-time 8 https://rpo-mng.ru/static/dashboard.js 2>/dev/null || true)"
            if [[ "$health" == *'"status":"ok"'* ]] \
              && [[ "$config" == *'"server_version":"0.6.0"'* ]] \
              && [[ "$config" == *'"latest_app_version":"2.1.0"'* ]] \
              && [[ "$config" == *'"pwa_version":"1.1.2"'* ]] \
              && [[ "$pwa" == *'PWA 1.1.2'* ]] \
              && [[ "$pwa" == *'/pwa-assets/sync-status.js?v=20260831-1'* ]] \
              && [[ "$pwa" == *'/pwa-assets/ux.js?v=20260830-2'* ]] \
              && [[ "$dashboard_loader" == *'dashboard-ux.js?v=20260830-1'* ]]; then
              echo "Production Android 2.1.0 / PWA 1.1.2 server-confirmation hotfix / Dashboard UX 2.1 is deployed on attempt $attempt"
              ok=1
              break
            fi
            echo "Waiting for PWA 1.1.2 autodeploy: attempt $attempt/36"
            sleep 10
          done
          if [[ "$ok" != "1" ]]; then
            echo "PWA 1.1.2 did not become ready in time" >&2
            exit 1
          fi

      - name: Verify installable PWA transmission status contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://rpo-mng.ru/app/ -o /tmp/rpo-pwa.html
          grep -F 'apple-mobile-web-app-capable' /tmp/rpo-pwa.html
          grep -F '/app/manifest.webmanifest' /tmp/rpo-pwa.html
          grep -F 'На экран Домой' /tmp/rpo-pwa.html
          grep -F 'permit-suggestion-menu' /tmp/rpo-pwa.html
          grep -F 'PWA 1.1.2' /tmp/rpo-pwa.html
          grep -F '/pwa-assets/sync-status.js?v=20260831-1' /tmp/rpo-pwa.html
          grep -F '/pwa-assets/ux.js?v=20260830-2' /tmp/rpo-pwa.html
          grep -F 'Зелёный статус «Передано» появляется только после подтверждения приёма сервером.' /tmp/rpo-pwa.html

          curl -fsS --max-time 10 https://rpo-mng.ru/app/manifest.webmanifest -o /tmp/rpo-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('/tmp/rpo-manifest.json').read_text())
          assert manifest['start_url']=='/app/'
          assert manifest['scope']=='/app/'
          assert manifest['display']=='standalone'
          assert {'192x192','512x512'} <= {x['sizes'] for x in manifest['icons']}
          print('PWA manifest confirmed')
          PY

          curl -fsS -D /tmp/sw-headers.txt --max-time 10 https://rpo-mng.ru/app/sw.js -o /tmp/sw.js
          grep -Fi 'service-worker-allowed: /app/' /tmp/sw-headers.txt
          grep -F "rpo-pwa-shell-v1.1.2" /tmp/sw.js
          grep -F '/pwa-assets/sync-status.js?v=20260831-1' /tmp/sw.js

          curl -fsS --max-time 10 https://rpo-mng.ru/pwa-assets/sync-status.js -o /tmp/pwa-sync-status.js
          grep -F "const SAVED_KEY = 'rpo_pwa_saved_v1'" /tmp/pwa-sync-status.js
          grep -F 'nativeRemoveItem.call(localStorage, SAVED_KEY)' /tmp/pwa-sync-status.js
          grep -F 'Ошибка передачи на сервер' /tmp/pwa-sync-status.js
          grep -F 'До подтверждения сервера этап не считается переданным' /tmp/pwa-sync-status.js
          grep -F "button.textContent = 'Исправить'" /tmp/pwa-sync-status.js
          grep -F 'event.stopImmediatePropagation()' /tmp/pwa-sync-status.js

          curl -fsS --max-time 10 https://rpo-mng.ru/pwa-assets/ux.js -o /tmp/pwa-ux.js
          grep -F 'Следующее действие' /tmp/pwa-ux.js
          grep -F 'history-search' /tmp/pwa-ux.js
          grep -F "window.addEventListener('pageshow'" /tmp/pwa-ux.js
          grep -F "event.target.dispatchEvent(new Event('input'" /tmp/pwa-ux.js
          if grep -Fq 'observe(stageFields' /tmp/pwa-ux.js; then
            echo 'Unsafe stageFields MutationObserver loop is still deployed' >&2
            exit 1
          fi
          if grep -Fq 'ux-next-open' /tmp/pwa-ux.js; then
            echo 'Removed Open button is still deployed' >&2
            exit 1
          fi

      - name: Verify operator dashboard UX layer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://rpo-mng.ru/static/dashboard.js -o /tmp/dashboard-loader.js
          curl -fsS --max-time 10 https://rpo-mng.ru/static/dashboard-core.js -o /tmp/dashboard-core.js
          curl -fsS --max-time 10 https://rpo-mng.ru/static/dashboard-ux.js -o /tmp/dashboard-ux.js
          grep -F 'dashboard-core.js?v=20260830-1' /tmp/dashboard-loader.js
          grep -F 'dashboard-ux.js?v=20260830-1' /tmp/dashboard-loader.js
          grep -F 'Требуют внимания' /tmp/dashboard-ux.js
          grep -F 'ux-drawer' /tmp/dashboard-ux.js
          test -s /tmp/dashboard-core.js

      - name: Verify mobile and approval API contract is deployed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://rpo-mng.ru/openapi.json -o /tmp/rpo-openapi.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('/tmp/rpo-openapi.json').read_text())
          paths = spec.get('paths', {})
          required = [
              '/api/mobile/permit',
              '/api/mobile/permit-suggestions',
              '/api/mobile/config',
              '/api/operator/events/{event_id}/approve',
              '/api/operator/analytics',
          ]
          for route in required:
              assert route in paths, f'Missing deployed API route: {route}'
              print(f'Deployed API route confirmed: {route}')
          PY

      - name: Verify rollback compatibility status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 'https://rpo-mng.ru/api/mobile/config?app_version=2.0.1' -o /tmp/mobile-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('/tmp/mobile-config.json').read_text())
          assert cfg['status']=='ok'
          assert cfg['latest_app_version']=='2.1.0'
          assert cfg['update_required'] is False
          assert cfg['update_available'] is True
          assert cfg['pwa_version']=='1.1.2'
          assert cfg['pwa_url']=='https://rpo-mng.ru/app/'
          assert cfg['minimum_supported_version']=='1.0.1'
          print('Older APKs remain supported; rollback-compatible contract confirmed')
          PY
