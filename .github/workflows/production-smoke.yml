name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    name: Production health, UX, PWA and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for VPS autodeploy and manager read-only release
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            health="$(curl -fsS --max-time 8 https://rpo-mng.ru/health 2>/dev/null || true)"
            config="$(curl -fsS --max-time 8 'https://rpo-mng.ru/api/mobile/config?app_version=2.1.0' 2>/dev/null || true)"
            pwa="$(curl -fsS --max-time 8 https://rpo-mng.ru/app/ 2>/dev/null || true)"
            dashboard_loader="$(curl -fsS --max-time 8 https://rpo-mng.ru/static/dashboard.js 2>/dev/null || true)"
            openapi="$(curl -fsS --max-time 8 https://rpo-mng.ru/openapi.json 2>/dev/null || true)"
            if [[ "$health" == *'"status":"ok"'* ]] \
              && [[ "$config" == *'"server_version":"0.7.2"'* ]] \
              && [[ "$config" == *'"latest_app_version":"2.2.2"'* ]] \
              && [[ "$config" == *'"pwa_version":"1.2.1"'* ]] \
              && [[ "$pwa" == *'PWA 1.2.1'* ]] \
              && [[ "$pwa" == *'/pwa-assets/deny-lock.js?v=20260831-1'* ]] \
              && [[ "$pwa" == *'/pwa-assets/history-status.js?v=20260901-1'* ]] \
              && [[ "$pwa" == *'/pwa-assets/sync-status.js?v=20260831-1'* ]] \
              && [[ "$dashboard_loader" == *'dashboard-decisions.js?v=20260831-1'* ]] \
              && [[ "$openapi" == *'"/users/create"'* ]]; then
              echo "Production Android 2.2.2 / PWA 1.2.1 / manager read-only release deployed on attempt $attempt"
              ok=1
              break
            fi
            echo "Waiting for manager read-only autodeploy: attempt $attempt/36"
            sleep 10
          done
          if [[ "$ok" != "1" ]]; then
            echo "Manager read-only release did not become ready in time" >&2
            exit 1
          fi

      - name: Verify installable PWA decision, history and transmission contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://rpo-mng.ru/app/ -o /tmp/rpo-pwa.html
          grep -F 'apple-mobile-web-app-capable' /tmp/rpo-pwa.html
          grep -F '/app/manifest.webmanifest' /tmp/rpo-pwa.html
          grep -F 'На экран Домой' /tmp/rpo-pwa.html
          grep -F 'permit-suggestion-menu' /tmp/rpo-pwa.html
          grep -F 'PWA 1.2.1' /tmp/rpo-pwa.html
          grep -F '/pwa-assets/sync-status.js?v=20260831-1' /tmp/rpo-pwa.html
          grep -F '/pwa-assets/deny-lock.js?v=20260831-1' /tmp/rpo-pwa.html
          grep -F '/pwa-assets/history-status.js?v=20260901-1' /tmp/rpo-pwa.html
          grep -F 'Если оператор запретит проведение работ по любому этапу' /tmp/rpo-pwa.html

          curl -fsS --max-time 10 https://rpo-mng.ru/app/manifest.webmanifest -o /tmp/rpo-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('/tmp/rpo-manifest.json').read_text())
          assert manifest['start_url']=='/app/'
          assert manifest['scope']=='/app/'
          assert manifest['display']=='standalone'
          assert {'192x192','512x512'} <= {x['sizes'] for x in manifest['icons']}
          print('PWA manifest confirmed')
          PY

          curl -fsS -D /tmp/sw-headers.txt --max-time 10 https://rpo-mng.ru/app/sw.js -o /tmp/sw.js
          grep -Fi 'service-worker-allowed: /app/' /tmp/sw-headers.txt
          grep -F "rpo-pwa-shell-v1.2.1" /tmp/sw.js
          grep -F '/pwa-assets/sync-status.js?v=20260831-1' /tmp/sw.js
          grep -F '/pwa-assets/deny-lock.js?v=20260831-1' /tmp/sw.js
          grep -F '/pwa-assets/history-status.js?v=20260901-1' /tmp/sw.js

          curl -fsS --max-time 10 https://rpo-mng.ru/pwa-assets/sync-status.js -o /tmp/pwa-sync-status.js
          grep -F "const SAVED_KEY = 'rpo_pwa_saved_v1'" /tmp/pwa-sync-status.js
          grep -F 'nativeRemoveItem.call(localStorage, SAVED_KEY)' /tmp/pwa-sync-status.js
          grep -F 'Ошибка передачи на сервер' /tmp/pwa-sync-status.js
          grep -F 'До подтверждения сервера этап не считается переданным' /tmp/pwa-sync-status.js
          grep -F "button.textContent = 'Исправить'" /tmp/pwa-sync-status.js

          curl -fsS --max-time 10 https://rpo-mng.ru/pwa-assets/deny-lock.js -o /tmp/pwa-deny-lock.js
          grep -F "const CACHE_KEY = 'rpo_pwa_denied_permit_v1'" /tmp/pwa-deny-lock.js
          grep -F 'ПРОВЕДЕНИЕ РАБОТ ЗАПРЕЩЕНО' /tmp/pwa-deny-lock.js
          grep -F "approval?.status === 'denied'" /tmp/pwa-deny-lock.js
          grep -F 'Выбрать другой НД' /tmp/pwa-deny-lock.js
          grep -F 'При отсутствии сети ранее полученный запрет сохраняется' /tmp/pwa-deny-lock.js

          curl -fsS --max-time 10 https://rpo-mng.ru/pwa-assets/history-status.js -o /tmp/pwa-history-status.js
          grep -F 'Проведение запрещено' /tmp/pwa-history-status.js
          grep -F 'history-denied' /tmp/pwa-history-status.js
          grep -F '/api/mobile/permit?permit_number=' /tmp/pwa-history-status.js

          curl -fsS --max-time 10 https://rpo-mng.ru/pwa-assets/ux.js -o /tmp/pwa-ux.js
          grep -F 'Следующее действие' /tmp/pwa-ux.js
          grep -F 'history-search' /tmp/pwa-ux.js
          grep -F 'data-history-filter="denied"' /tmp/pwa-ux.js
          grep -F "window.addEventListener('pageshow'" /tmp/pwa-ux.js
          grep -F "event.target.dispatchEvent(new Event('input'" /tmp/pwa-ux.js
          if grep -Fq 'observe(stageFields' /tmp/pwa-ux.js; then
            echo 'Unsafe stageFields MutationObserver loop is still deployed' >&2
            exit 1
          fi
          if grep -Fq 'ux-next-open' /tmp/pwa-ux.js; then
            echo 'Removed Open button is still deployed' >&2
            exit 1
          fi

      - name: Verify operator dashboard decision controls
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://rpo-mng.ru/static/dashboard.js -o /tmp/dashboard-loader.js
          curl -fsS --max-time 10 https://rpo-mng.ru/static/dashboard-core.js -o /tmp/dashboard-core.js
          curl -fsS --max-time 10 https://rpo-mng.ru/static/dashboard-ux.js -o /tmp/dashboard-ux.js
          curl -fsS --max-time 10 https://rpo-mng.ru/static/dashboard-decisions.js -o /tmp/dashboard-decisions.js
          grep -F 'dashboard-core.js?v=20260830-1' /tmp/dashboard-loader.js
          grep -F 'dashboard-ux.js?v=20260830-1' /tmp/dashboard-loader.js
          grep -F 'dashboard-decisions.js?v=20260831-1' /tmp/dashboard-loader.js
          grep -F 'Требуют внимания' /tmp/dashboard-ux.js
          grep -F 'data-rpo-decision="denied"' /tmp/dashboard-decisions.js
          grep -F 'ПРОВЕДЕНИЕ ЗАПРЕЩЕНО' /tmp/dashboard-decisions.js
          grep -F '/decision' /tmp/dashboard-decisions.js
          test -s /tmp/dashboard-core.js

      - name: Verify mobile, operator and manager API contract is deployed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 https://rpo-mng.ru/openapi.json -o /tmp/rpo-openapi.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('/tmp/rpo-openapi.json').read_text())
          paths = spec.get('paths', {})
          required = [
              '/api/mobile/events',
              '/api/mobile/permit',
              '/api/mobile/permit-suggestions',
              '/api/mobile/config',
              '/api/operator/events/{event_id}/approve',
              '/api/operator/events/{event_id}/decision',
              '/api/operator/analytics',
              '/users/create',
          ]
          for route in required:
              assert route in paths, f'Missing deployed API route: {route}'
              print(f'Deployed API route confirmed: {route}')
          decision = paths['/api/operator/events/{event_id}/decision']['post']
          assert 'requestBody' in decision
          manager_create = paths['/users/create']['post']
          assert 'requestBody' in manager_create
          print('Operator decision and manager user creation contracts confirmed')
          PY

      - name: Verify rollback compatibility status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 'https://rpo-mng.ru/api/mobile/config?app_version=2.1.0' -o /tmp/mobile-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('/tmp/mobile-config.json').read_text())
          assert cfg['status']=='ok'
          assert cfg['latest_app_version']=='2.2.2'
          assert cfg['update_required'] is False
          assert cfg['update_available'] is True
          assert cfg['pwa_version']=='1.2.1'
          assert cfg['pwa_url']=='https://rpo-mng.ru/app/'
          assert cfg['server_version']=='0.7.2'
          assert cfg['minimum_supported_version']=='1.0.1'
          print('Older APKs remain supported; manager read-only release contract confirmed')
          PY
