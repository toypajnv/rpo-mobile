name: Publish existing APK

on:
  push:
    paths:
      - '.github/workflows/publish-existing-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh run download 31831959014 --repo "$GITHUB_REPOSITORY" --name rpo-mobile-debug-17 --dir out
          find out -type f -maxdepth 2 -print
          APK=$(find out -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" rpo-mobile-1.0.1.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.1-test rpo-mobile-1.0.1.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.1-test rpo-mobile-1.0.1.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RPO Mobile — Test 1.0.1" \
              --notes "Тестовая сборка РПО Mobile 1.0.1 для проверки обновлённого интерфейса и логики приложения." \
              --prerelease
          fi

# Publish APK build 17 as public release asset.
