name: Publish existing APK

on:
  push:
    paths:
      - '.github/workflows/publish-existing-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh run download 31867981739 --repo "$GITHUB_REPOSITORY" --name rpo-mobile-debug-21 --dir out
          find out -type f -maxdepth 2 -print
          APK=$(find out -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" rpo-mobile-1.1.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.1.0-test rpo-mobile-1.1.0.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.1.0-test rpo-mobile-1.1.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RPO Mobile — Test 1.1.0" \
              --notes "Тестовая сборка РПО Mobile 1.1.0: HTTPS rpo-mng.ru, offline-first очередь, автоматическая отправка после восстановления сети, поддержка медленного мобильного соединения, автозаполнение номеров НД и обновлённые этапы работ." \
              --prerelease
          fi

# Publish APK build 21 as public release asset.
