name: Apply RPO 2.0 quality fixes

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-v2-quality-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply final fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} marker not found')
              return text.replace(old, new, 1)

          main = Path('server/app/main.py')
          text = main.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'def _apply_record_filters(stmt, q: str = "", unit: str = ""):\n    query = (q or "").strip()\n    structural_unit = (unit or "").strip()\n',
              'def _apply_record_filters(stmt, q: str = "", unit: str = ""):\n    query = q.strip() if isinstance(q, str) else ""\n    structural_unit = unit.strip() if isinstance(unit, str) else ""\n',
              'record filter',
          )
          text = replace_once(
              text,
              'def _apply_event_filters(stmt, q: str = "", unit: str = ""):\n    query = (q or "").strip()\n    structural_unit = (unit or "").strip()\n',
              'def _apply_event_filters(stmt, q: str = "", unit: str = ""):\n    query = q.strip() if isinstance(q, str) else ""\n    structural_unit = unit.strip() if isinstance(unit, str) else ""\n',
              'event filter',
          )
          text = replace_once(
              text,
              '    approved = [field for field in required if str(field.get("approval_status", "")) == "approved"]\n    approved_times = sorted(',
              '    approved = [field for field in required if str(field.get("approval_status", "")) == "approved"]\n    stop_at = _field_dt(data, "AZ")\n    resume_at = _field_dt(data, "BA")\n    stopped = bool(stop_at and (not resume_at or stop_at > resume_at))\n    approved_times = sorted(',
              'stopped calculation',
          )
          text = replace_once(
              text,
              '    if pending:\n        status = "pending"\n        label = "Ожидает разрешения"\n    elif approved:\n',
              '    if stopped:\n        status = "stopped"\n        label = "Работы остановлены"\n    elif pending:\n        status = "pending"\n        label = "Ожидает разрешения"\n    elif approved:\n',
              'approval state',
          )
          text = replace_once(
              text,
              'existing = db.scalar(select(MobileEvent).where(MobileEvent.client_event_id == payload.client_event_id))\n        if existing:',
              'existing = db.scalar(select(MobileEvent).where(MobileEvent.client_event_id == client_event_id))\n        if existing:',
              'legacy duplicate id',
          )
          main.write_text(text, encoding='utf-8')

          vm = Path('android/app/src/main/java/ru/rpo/mobile/ui/RpoViewModel.kt')
          text = vm.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'errors = _state.value.errors - "worker" - "permit",\n                        message = "Ранее заполненные данные по НД загружены с сервера",',
              'errors = _state.value.errors - "worker" - "permit" - "structuralUnit",\n                        message = "Ранее заполненные данные по НД загружены с сервера",',
              'loaded unit validation',
          )
          text = replace_once(
              text,
              '            serverSavedStageIds = emptySet(),\n            errors = _state.value.errors - "permit" - "worker",\n            message = null,',
              '            serverSavedStageIds = emptySet(),\n            approvalSummary = null,\n            errors = _state.value.errors - "permit" - "worker" - "structuralUnit",\n            message = null,',
              'permit switch status reset',
          )
          vm.write_text(text, encoding='utf-8')

          units = Path('android/app/src/main/java/ru/rpo/mobile/ui/StructuralUnits.kt')
          text = units.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    "not_required" -> "Разрешение не требуется"\n    else -> "Статус разрешения пока не получен"',
              '    "not_required" -> "Разрешение не требуется"\n    "stopped" -> "Работы остановлены"\n    else -> "Статус разрешения пока не получен"',
              'stopped mobile label',
          )
          units.write_text(text, encoding='utf-8')

          ui = Path('android/app/src/main/java/ru/rpo/mobile/ui/RpoApp.kt')
          text = ui.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    val pending = approval.status == "pending"\n    val approved = approval.status == "approved"\n    val bg = when {\n        pending -> Color(0xFFFFF4DF)',
              '    val pending = approval.status == "pending"\n    val approved = approval.status == "approved"\n    val stopped = approval.status == "stopped"\n    val bg = when {\n        stopped -> Color(0xFFFFEEEE)\n        pending -> Color(0xFFFFF4DF)',
              'stopped status background',
          )
          text = replace_once(
              text,
              '    val accent = when {\n        pending -> Orange\n        approved -> Green',
              '    val accent = when {\n        stopped -> Red\n        pending -> Orange\n        approved -> Green',
              'stopped status accent',
          )
          text = replace_once(
              text,
              '                    when {\n                        pending -> "Передано на сервер. Ожидающих разрешения этапов: ${approval.pending_count}."',
              '                    when {\n                        stopped -> "Работы остановлены. Для возобновления передайте этап «Возобновление работ» и дождитесь разрешения оператора."\n                        pending -> "Передано на сервер. Ожидающих разрешения этапов: ${approval.pending_count}."',
              'stopped status message',
          )
          ui.write_text(text, encoding='utf-8')

          test = Path('android/app/src/test/java/ru/rpo/mobile/ui/StructuralUnitsTest.kt')
          text = test.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '        assertEquals("Разрешение не требуется", approvalStatusLabel("not_required"))',
              '        assertEquals("Разрешение не требуется", approvalStatusLabel("not_required"))\n        assertEquals("Работы остановлены", approvalStatusLabel("stopped"))',
              'stopped status test',
          )
          test.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q server/app server/tests
          node --check server/app/static/dashboard.js
          git diff --check

      - name: Commit working code and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v2-quality-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RPO 2.0: finalize approval and filter quality fixes'
          git push origin HEAD:develop
