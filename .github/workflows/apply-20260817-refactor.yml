name: Apply 2026-08-17 RPO refactor

on:
  push:
    branches: [develop]
    paths:
      - 'ops/apply_20260817_refactor.py'
      - '.github/workflows/apply-20260817-refactor.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: server
      DATABASE_URL: sqlite:////tmp/rpo-refactor.db
      SECRET_KEY: refactor-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Refactor123!
      MAIL_MODE: file
      EXPORT_DIR: /tmp/rpo-refactor-exports
      OUTBOX_DIR: /tmp/rpo-refactor-outbox
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply code refactor
        run: python ops/apply_20260817_refactor.py

      - name: Check diff
        run: git diff --check

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements-test.txt

      - name: Install backend tests
        run: python -m pip install -r server/requirements-test.txt

      - name: Compile backend
        run: python -m compileall -q server/app

      - name: Run backend regression tests
        run: python -m unittest discover -s server/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Commit tested refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine dates stages resume validation and server prefill'
          git push origin HEAD:develop
