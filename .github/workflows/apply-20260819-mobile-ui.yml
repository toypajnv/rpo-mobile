name: Apply 2026-08-19 mobile UI polish

on:
  push:
    branches: [develop]
    paths:
      - 'ops/apply_20260819_mobile_ui.py'
      - '.github/workflows/apply-20260819-mobile-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply mobile polish
        run: python ops/apply_20260819_mobile_ui.py

      - name: Check diff
        run: git diff --check

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish mobile date layout stage readiness and Russian input'
          git push origin HEAD:develop
