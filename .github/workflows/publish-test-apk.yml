name: Publish test APK

on:
  push:
    paths:
      - '.github/workflows/publish-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare release file
        run: cp app/build/outputs/apk/debug/app-debug.apk ../rpo-mobile-test.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          if gh release view v0.1.0-test >/dev/null 2>&1; then
            gh release upload v0.1.0-test rpo-mobile-test.apk --clobber
          else
            gh release create v0.1.0-test rpo-mobile-test.apk \
              --target "$GITHUB_SHA" \
              --title "RPO Mobile — Test 0.1.0" \
              --notes "Тестовая debug-сборка для первого этапа проверки интерфейса и логики приложения." \
              --prerelease
          fi
