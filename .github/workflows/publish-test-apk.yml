name: Publish test APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/publish-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-test-apk-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RPO_SERVER_URL: https://rpo-mng.ru/
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Android unit tests before APK build
        run: gradle --no-daemon testDebugUnitTest

      - name: Prepare stable test signing key
        working-directory: .
        shell: bash
        run: |
          base64 --decode .github/keys/rpo-test.keystore.b64 > android/app/rpo-test.keystore
          keytool -list -keystore android/app/rpo-test.keystore -storepass rpo-test-2026 -alias rpo-test >/dev/null

      - name: Build debug APK after tests
        run: gradle --no-daemon assembleDebug

      - name: Resolve app version
        id: version
        working-directory: .
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-test" >> "$GITHUB_OUTPUT"
          echo "apk=rpo-mobile-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare release file
        working-directory: .
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.version.outputs.apk }}
        working-directory: .
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "RPO Mobile — Test $VERSION" \
              --notes "Проверенная тестовая сборка РПО Mobile $VERSION для Android. Сервер: https://rpo-mng.ru/. Перед сборкой выполняются unit tests; APK подписан стабильным тестовым ключом." \
              --prerelease
          fi
