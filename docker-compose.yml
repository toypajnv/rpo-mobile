services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rpo
      POSTGRES_USER: rpo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpo -d rpo"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change_me_please}
      DATABASE_URL: postgresql+psycopg://rpo:${POSTGRES_PASSWORD:-change_me}@db:5432/rpo
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      MAIL_MODE: ${MAIL_MODE:-file}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-РПО Сервер <rpo@rpo-mng.ru>}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-rpo@example.ru}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      EXPORT_DIR: /app/data/exports
      OUTBOX_DIR: /app/data/outbox
    volumes:
      - server_data:/app/data

  ostanovka-mail:
    build: ./server
    restart: unless-stopped
    command: ["python", "-m", "app.ostanovka_worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://rpo:${POSTGRES_PASSWORD:-change_me}@db:5432/rpo
      STOP_IMAP_HOST: ${STOP_IMAP_HOST:-}
      STOP_IMAP_PORT: ${STOP_IMAP_PORT:-993}
      STOP_IMAP_USERNAME: ${STOP_IMAP_USERNAME:-}
      STOP_IMAP_PASSWORD: ${STOP_IMAP_PASSWORD:-}
      STOP_IMAP_FOLDER: ${STOP_IMAP_FOLDER:-INBOX}
      STOP_IMAP_SENDER: ${STOP_IMAP_SENDER:-}
      STOP_IMAP_SUBJECT: ${STOP_IMAP_SUBJECT:-}
      STOP_IMAP_POLL_SECONDS: ${STOP_IMAP_POLL_SECONDS:-60}

volumes:
  postgres_data:
  server_data:
