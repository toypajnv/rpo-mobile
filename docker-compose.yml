services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rpo
      POSTGRES_USER: rpo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpo -d rpo"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change_me_please}
      VACANCY_ADMIN_USERNAME: ${VACANCY_ADMIN_USERNAME:-admin}
      VACANCY_ADMIN_PASSWORD_HASH: ${VACANCY_ADMIN_PASSWORD_HASH:-}
      DATABASE_URL: postgresql+psycopg://rpo:${POSTGRES_PASSWORD:-change_me}@db:5432/rpo
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      MAIL_MODE: ${MAIL_MODE:-file}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-РПО Сервер <rpo@rpo-mng.ru>}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-rpo@example.ru}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      EXPORT_DIR: /app/data/exports
      OUTBOX_DIR: /app/data/outbox
    volumes:
      - server_data:/app/data

  ostanovka-mail:
    build: ./server
    restart: unless-stopped
    command: ["python", "-m", "app.ostanovka_worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://rpo:${POSTGRES_PASSWORD:-change_me}@db:5432/rpo
      STOP_MAIL_PROVIDER: ${STOP_MAIL_PROVIDER:-resend}
      STOP_MAIL_POLL_SECONDS: ${STOP_MAIL_POLL_SECONDS:-60}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STOP_RESEND_API_BASE: ${STOP_RESEND_API_BASE:-https://api.resend.com}
      STOP_RESEND_TO: ${STOP_RESEND_TO:-}
      STOP_RESEND_SENDER: ${STOP_RESEND_SENDER:-}
      STOP_RESEND_SUBJECT: ${STOP_RESEND_SUBJECT:-Реестр остановок}
      STOP_RESEND_UKZ_SUBJECT: ${STOP_RESEND_UKZ_SUBJECT:-Стоп-лист УКЗ}
      STOP_RESEND_LIST_LIMIT: ${STOP_RESEND_LIST_LIMIT:-50}
      STOP_MAX_ATTACHMENT_MB: ${STOP_MAX_ATTACHMENT_MB:-25}
      STOP_IMAP_HOST: ${STOP_IMAP_HOST:-}
      STOP_IMAP_PORT: ${STOP_IMAP_PORT:-993}
      STOP_IMAP_USERNAME: ${STOP_IMAP_USERNAME:-}
      STOP_IMAP_PASSWORD: ${STOP_IMAP_PASSWORD:-}
      STOP_IMAP_FOLDER: ${STOP_IMAP_FOLDER:-INBOX}
      STOP_IMAP_SENDER: ${STOP_IMAP_SENDER:-}
      STOP_IMAP_SUBJECT: ${STOP_IMAP_SUBJECT:-Реестр остановок}
      STOP_IMAP_UKZ_SUBJECT: ${STOP_IMAP_UKZ_SUBJECT:-Стоп-лист УКЗ}
      STOP_IMAP_POLL_SECONDS: ${STOP_IMAP_POLL_SECONDS:-60}

  vacancies-worker:
    build: ./server
    restart: unless-stopped
    command: ["python", "-m", "app.vacancy_worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://rpo:${POSTGRES_PASSWORD:-change_me}@db:5432/rpo
      HH_API_TOKEN: ${HH_API_TOKEN:-}
      HH_USER_AGENT: ${HH_USER_AGENT:-RPOVacancies/1.0 (rpo@rpo-mng.ru)}
      VACANCY_SCAN_INTERVAL_SECONDS: "3600"
      PYTHONDONTWRITEBYTECODE: "1"

volumes:
  postgres_data:
  server_data:
